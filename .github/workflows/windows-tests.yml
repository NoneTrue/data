name: Windows source tests
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock-windows.txt
      - name: Install source dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements-lock-windows.txt'
      - name: Check dependencies
        run: python -m pip check
      - name: Run isolated tests
        run: python verify.py
      - name: Test native Windows Excel table
        run: python verify.py --native --pattern test_region_excel.py
      - name: Test native Windows report editing
        run: python verify.py --native --pattern test_report_target_name.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-summary
          path: .validation/*.json
          include-hidden-files: true
